# nginx site for the IIM AI Assistant.
#
# Installed by deploy/setup-vps.sh as
#   /etc/nginx/sites-available/iim-chatbot
# with DOMAIN_NAME replaced. certbot then adds the HTTPS
# (listen 443) block and the HTTP -> HTTPS redirect.

upstream iim_chatbot {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_NAME www.DOMAIN_NAME;

    # Chat messages and enquiries are small.
    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Streaming chat answers: pass each piece through at once
    # and allow slow CPU answers to finish.
    location = /api/chat {
        proxy_pass http://iim_chatbot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://iim_chatbot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (not append) so visitors can't fake their IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
